name: ci

# The Feature 0 pipeline (docs/feature-plans/F0-repository-and-engineering-foundation.md).
# Tier 1 is always on and genuinely offline. Tier 2 (Docker/network) and the NuGet-advisory
# promotion run on a schedule / on demand (ADR 0002, ADR 0013).
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:
    inputs:
      run_pzserver:
        description: "Also run the ~40-min pzserver-real-install (real SteamCMD 6.72 GiB PZ install + boot)."
        type: boolean
        default: false
  schedule:
    # Exercises the networked tier and the advisory-promotion job on their own cadence.
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget-packages

jobs:
  # ---------------------------------------------------------------------------
  # Tier 1: always on. Restore is the ONLY step allowed to touch the network;
  # the whole test run happens inside a network namespace with loopback only.
  # The tier split is by ASSEMBLY, never by category filter (ADR 0002).
  # ---------------------------------------------------------------------------
  offline:
    name: tier1-offline
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Record the toolchain actually in use
        run: |
          echo "dotnet --version: $(dotnet --version)"
          dotnet --list-sdks
          echo "runner: $(uname -srm), nproc: $(nproc)"

      - name: Restore in locked mode (the only network-permitted step)
        run: dotnet restore ZWarden.slnx --locked-mode

      - name: Build with warnings-as-errors and analyzers on
        run: dotnet build ZWarden.slnx -c Release --no-restore

      - name: Prove the sandbox really has no network
        run: |
          chmod +x ci/*.sh
          ci/offline-run.sh ci/assert-no-network.sh

      - name: Run the offline (tier-1) assemblies with no network at all
        run: |
          # Each --minimum-expected-tests floor is baked into the test csproj, so the
          # silent-drop and discovery guards travel with every run, here included.
          for proj in \
            tests/ZWarden.Domain.Tests/ZWarden.Domain.Tests.csproj \
            tests/ZWarden.Contracts.Tests/ZWarden.Contracts.Tests.csproj \
            tests/ZWarden.Diagnostics.Tests/ZWarden.Diagnostics.Tests.csproj \
            tests/ZWarden.Infrastructure.Tests/ZWarden.Infrastructure.Tests.csproj \
            tests/ZWarden.Web.Tests/ZWarden.Web.Tests.csproj \
            tests/ZWarden.ArchitectureTests/ZWarden.ArchitectureTests.csproj \
            tests/ZWarden.Agent.Tests/ZWarden.Agent.Tests.csproj \
            tests/ZWarden.Rcon.Tests/ZWarden.Rcon.Tests.csproj
          do
            echo "=== $proj ==="
            ci/offline-run.sh dotnet test --project "$proj" -c Release --no-build \
              --report-trx -- --output Detailed | grep -vE "^\s*$"
          done
          echo "=== step summary (must be read in the writing step) ==="
          cat "$GITHUB_STEP_SUMMARY" || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tier1-reports
          path: "**/TestResults/**"
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Regression guard for the silent-drop hazard: with reflection mode removed
  # and source generation back on, the .razor test vanishes and the run still
  # goes green. The discovery floor must be what turns it red (ADR 0002).
  # ---------------------------------------------------------------------------
  silent-drop-guard:
    name: tier1-silent-drop-guard
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore ZWarden.slnx --locked-mode

      - name: Strip the reflection switch and prove the razor test disappears
        run: |
          echo "// removed by CI to measure the silent drop" \
            > tests/ZWarden.Web.Tests/ReflectionMode.cs
          dotnet build tests/ZWarden.Web.Tests/ZWarden.Web.Tests.csproj \
            -c Release --no-restore -p:EnableTUnitSourceGeneration=true

          exe="tests/ZWarden.Web.Tests/bin/Release/net10.0/ZWarden.Web.Tests"
          echo "--- discovery without reflection mode ---"; "$exe" --list-tests || true

          # The floor must equal the full test count (keep in sync with the csproj's
          # --minimum-expected-tests). With reflection mode on, all N tests are discovered and
          # the floor is met; stripping it drops the .razor-file test(s), so N-1 < N trips the
          # floor - proving the reflection switch is load-bearing. A floor below the source-gen
          # -discoverable count (the .cs tests) would pass even with the drop and defeat the guard.
          set +e
          "$exe" --minimum-expected-tests 324 > guarded.log 2>&1
          guarded=$?
          set -e
          cat guarded.log
          {
            echo "### silent-drop guard"
            echo ""
            echo "razor test dropped, guard on -> exit \`$guarded\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$guarded" -eq 0 ]; then
            echo "::error::the discovery floor did not catch the dropped razor test"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # The second silent-failure guard (ADR 0003): forgetting the Tailwind step is
  # invisible - the utility class is simply absent. Regenerate and diff.
  # ---------------------------------------------------------------------------
  stale-css-guard:
    name: tier1-stale-app-css
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: src/ZWarden.Web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Regenerate app.css and fail if the committed copy is stale
        run: |
          npm ci
          npm run build:css
          if ! git diff --exit-code -- wwwroot/app.css; then
            echo "::error::wwwroot/app.css is stale - run 'npm run build:css' and commit the result"
            exit 1
          fi
          echo "app.css is up to date."

  # ---------------------------------------------------------------------------
  # The reference Caddy ingress config (F32, ADR 0035). Always-on gate so a
  # malformed or unformatted Caddyfile fails on the PR - the behavioural proof
  # (308 redirect + WebSocket upgrade) is the networked CaddyReferenceDeployment
  # test, which only runs on schedule/dispatch. Uses the pinned caddy image.
  # ---------------------------------------------------------------------------
  caddy-config:
    name: tier1-caddy-config
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Validate and format-check the reference Caddy ingress config
        env:
          # A placeholder host so {$ZWARDEN_DOMAIN} resolves during adaptation; this checks config shape only.
          ZWARDEN_DOMAIN: zwarden.example.com
        run: |
          fail=0
          for f in deploy/caddy/Caddyfile deploy/caddy/Caddyfile.internal; do
            echo "== validate $f =="
            docker run --rm -e ZWARDEN_DOMAIN \
              -v "$PWD/$f:/etc/caddy/Caddyfile:ro" \
              caddy:2.11.4 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

            echo "== fmt-check $f =="
            if ! docker run --rm -v "$PWD/$f:/etc/caddy/Caddyfile:ro" \
              caddy:2.11.4 caddy fmt /etc/caddy/Caddyfile | diff - "$f"; then
              echo "::error file=$f::not canonically formatted - run 'caddy fmt --overwrite $f' and commit"
              fail=1
            fi
          done
          exit $fail

  # ---------------------------------------------------------------------------
  # End-to-end tier: assembly stub only in Feature 0. Playwright wiring is
  # deferred (never exercised in the spike); this keeps the tier's shape visible.
  # ---------------------------------------------------------------------------
  e2e-stub:
    name: tier3-e2e-stub
    runs-on: ubuntu-latest
    steps:
      - run: echo "E2E (Playwright) tier is a stub in Feature 0; wired by a later feature."

  # ---------------------------------------------------------------------------
  # Tier 2: scheduled / opt-in, network + Docker permitted. Testcontainers here.
  # ---------------------------------------------------------------------------
  networked:
    name: tier2-networked
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore ZWarden.slnx --locked-mode
      - run: dotnet build ZWarden.slnx -c Release --no-restore

      - name: Confirm this tier has egress and Docker
        run: |
          curl -sS --max-time 15 -o /dev/null -w "nuget.org index HTTP %{http_code}\n" https://api.nuget.org/v3/index.json
          docker version --format '{{.Server.APIVersion}}' | sed 's/^/docker server API version: /'

      - name: Integration tests against a real PostgreSQL 18 container
        run: |
          dotnet test --project tests/ZWarden.IntegrationTests/ZWarden.IntegrationTests.csproj \
            -c Release --no-build -- --output Detailed

  # ---------------------------------------------------------------------------
  # NuGet-advisory promotion (ADR 0013). On PR/main a live advisory is only a
  # warning; here it is promoted to an error. If it fails, file a tracking issue.
  # ---------------------------------------------------------------------------
  advisory:
    name: nuget-advisory-promotion
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build with NuGet advisories promoted to errors
        id: audit
        run: |
          dotnet restore ZWarden.slnx --locked-mode
          dotnet build ZWarden.slnx -c Release --no-restore -p:PromoteNuGetAudit=true

      - name: File a tracking issue if an advisory broke the build
        if: failure() && steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "NuGet advisory promotion failed on $(date -u +%Y-%m-%d)" \
            --body "The scheduled advisory-promotion build failed: a dependency now carries a published NuGet advisory (NU19xx). On PR/main this is only a warning (ADR 0013), but it must be triaged and is a hard blocker at the F40 gate. See the failing run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ---------------------------------------------------------------------------
  # Supply-chain gate (F40 / ADR 0039, PRD §55). SBOM plus secret, dependency,
  # and container scanning run on every PR. Signing and publishing the images
  # (and promoting the NuGet advisory gate above to a hard blocker) land on the
  # release path in F40 PR-C. Scans gate on severity, not on mere presence;
  # ignore-unfixed keeps the gate to findings a maintainer can actually act on.
  # ---------------------------------------------------------------------------
  sbom:
    name: sbom
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore in locked mode
        run: dotnet restore ZWarden.slnx --locked-mode
      - name: Generate a CycloneDX SBOM for the whole solution
        run: |
          dotnet tool install --global CycloneDX
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet CycloneDX ZWarden.slnx --output sbom --json
          test -s sbom/bom.json || { echo "::error::SBOM (sbom/bom.json) was not generated"; exit 1; }
      - name: Upload the SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/bom.json

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the full history, not just the tip
      - name: Scan the repository and history for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  dependency-scan:
    name: dependency-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan (the .NET dependency graph + config)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  container-scan:
    name: container-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Build the canonical PZServer image
        run: docker build -t zwarden-pzserver:scan src/ZWarden.PZServer
      - name: Trivy image scan (PRD §55 container vulnerability scanning)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: zwarden-pzserver:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # ---------------------------------------------------------------------------
  # ZWarden.PZServer (Feature 12). The bats suite is the always-on offline tier
  # (no network); the image build needs general network but never Steam; the real
  # 6.72 GiB PZ install + boot is scheduled (ADR 0009).
  # ---------------------------------------------------------------------------
  pzserver-bats:
    name: pzserver-offline-bats
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run the PZServer shell suite (no network, synthetic fixtures)
        run: bats tests/pzserver

  pzserver-image:
    name: pzserver-image-contract
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Build the image (apt + Valve SteamCMD tarball; no Steam/PZ)
        run: docker build -t zwarden-pzserver:ci src/ZWarden.PZServer
      - name: Assert the canonical container contract (T8)
        run: |
          inspect() { docker image inspect zwarden-pzserver:ci --format "$1"; }
          echo "$(inspect '{{json .Config.Labels}}')" | grep -q '"io.zwarden.managed":"true"'
          echo "$(inspect '{{json .Config.Labels}}')" | grep -q '"io.zwarden.runtime":"project-zomboid"'
          ports="$(inspect '{{json .Config.ExposedPorts}}')"
          echo "$ports" | grep -q '16261/udp'
          echo "$ports" | grep -q '16262/udp'
          if echo "$ports" | grep -q '27015'; then echo "::error::RCON port must not be exposed"; exit 1; fi
          [ "$(inspect '{{.Config.User}}')" = "pzserver" ] || { echo "::error::image must run non-root"; exit 1; }
          inspect '{{json .Config.Healthcheck.Test}}' | grep -q 'healthcheck.sh'
          inspect '{{json .Config.Volumes}}' | grep -q '/pz/data'
          echo "PZServer image contract OK."

  # The scheduled cadence always exercises this. A workflow_dispatch runs it only
  # when explicitly opted in (run_pzserver=true), so dispatching the networked
  # Postgres/integration tier on its own no longer forces this ~40-min job (F12/#65).
  pzserver-real-install:
    name: pzserver-real-install
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_pzserver)
    runs-on: ubuntu-latest
    # The 6.72 GiB first-run (download + preallocation + first world-gen) can take ~40 min; leave headroom for
    # the container to reach `healthy` after it boots (the healthcheck start-period is 45 min; #191).
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t zwarden-pzserver:ci src/ZWarden.PZServer
      - name: Real SteamCMD install + boot to a healthy container
        run: |
          # Run under the SAME memory profile the Agent provisions managed containers with (#198): the derived
          # cgroup cap (10 GiB) with the injected heap (4 GiB). A cap equal to the heap OOM-kills on boot, and CI's
          # earlier uncapped `docker run` could never see that — so this capped run is the #198 regression guard.
          # Requires a runner with >10 GiB RAM (ubuntu-latest has ~16 GiB).
          docker run -d --name pz --memory 10g -e ZW_PZ_XMS=4g -e ZW_PZ_XMX=4g zwarden-pzserver:ci
          # Stream the container's logs LIVE so the SteamCMD download and server boot are visible during the run,
          # not just tailed at the end. Wrapped in a collapsible group; stopped before the health assertion.
          echo "::group::PZ container logs (live — SteamCMD install + boot)"
          docker logs -f pz &
          logs_pid=$!
          status=starting
          # Up to ~55 min (330 x 10s) for a healthy transition — the first-run install alone can take ~40 min,
          # then the server boots and the healthcheck flips healthy (#191). Kept under timeout-minutes above.
          for _ in $(seq 1 330); do
            status="$(docker inspect --format '{{.State.Health.Status}}' pz 2>/dev/null || echo gone)"
            [ "$status" = "healthy" ] && break
            [ "$status" = "gone" ] && break
            # A failed install exits the container, but its health status freezes at
            # "starting" (start-period suppresses "unhealthy"), so waiting on health alone
            # burns the full timeout. Stop the moment it is no longer running (F12/#65).
            if [ "$(docker inspect --format '{{.State.Running}}' pz 2>/dev/null || echo false)" != "true" ]; then
              status="exited"; break
            fi
            sleep 10
          done
          # Stop the live stream and close the log group before reporting the result.
          kill "$logs_pid" 2>/dev/null || true
          wait "$logs_pid" 2>/dev/null || true
          echo "::endgroup::"
          echo "final health status: $status"
          if [ "$status" != "healthy" ]; then echo "::error::container did not become healthy (status=$status)"; exit 1; fi
      - name: Graceful stop saves the world and quits cleanly
        run: |
          docker stop -t 90 pz
          logs="$(docker logs pz 2>&1)"
          echo "::group::PZ container logs at shutdown (tail)"
          printf '%s\n' "$logs" | tail -40
          echo "::endgroup::"
          # The data-safety guarantee (F15): on `docker stop` the world is SAVED and the server quits cleanly
          # BEFORE the SIGKILL deadline — never a bare kill that corrupts the world. Build 42's launcher handles
          # SIGTERM natively (save then quit); the container entrypoint's FIFO save/quit is the same guarantee by
          # a different route. Assert the OUTCOME (saved + clean shutdown), not which handler produced it.
          if printf '%s\n' "$logs" | grep -qiE 'World saved|Saving finish' \
             && printf '%s\n' "$logs" | grep -qiE 'Shutdown handling finished|Server exited'; then
            echo "graceful stop OK — world saved and server shut down cleanly"
          else
            echo "::error::stop was not graceful (no world-save / clean-shutdown markers in the container logs)"; exit 1
          fi
      - name: No PZ artefact leaked into the workspace
        if: always()
        run: |
          docker rm -f pz >/dev/null 2>&1 || true
          if git status --porcelain | grep -q .; then echo "::error::working tree dirtied by the run"; git status --porcelain; exit 1; fi
