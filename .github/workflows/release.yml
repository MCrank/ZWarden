name: release

# The signed-release pipeline (F40 PR-C, ADR 0039, PRD §55). It runs only on a version tag and is the
# release path the rest of the gate defers to: it builds and publishes the three component images to GHCR,
# signs each by digest with cosign keyless (GitHub OIDC — no long-lived keys), attaches a CycloneDX SBOM as
# an attestation, and cuts a GitHub Release carrying a digest-pinned Compose and a SHA256SUMS manifest. The
# NuGet advisory gate — warning-only on ordinary PRs (ADR 0013) — is a HARD BLOCKER here.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release and upload assets
  packages: write # push images to GHCR
  id-token: write # cosign keyless signing (OIDC)
  attestations: write # SBOM / provenance attestations

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  # No release ships while a dependency carries a published NuGet advisory (NU19xx). Promoted from a
  # warning (ADR 0013) to an error that fails the release build (ADR 0039).
  advisory-gate:
    name: advisory-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore ZWarden.slnx --locked-mode
      - name: Fail the release on any NuGet advisory (hard gate on the release path)
        run: dotnet build ZWarden.slnx -c Release --no-restore -p:PromoteNuGetAudit=true

  publish:
    name: build-sign-publish
    needs: advisory-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3

      - name: Compute the image namespace (GHCR requires a lowercase owner)
        run: echo "NS=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      # Build and push each component. The build context matches the reference Compose (web/agent from the
      # repo root; the PZServer image from its own directory). Each step exposes the pushed digest.
      - name: Build & push web
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/ZWarden.Web/Dockerfile
          push: true
          tags: |
            ${{ env.NS }}/zwarden-web:${{ github.ref_name }}
            ${{ env.NS }}/zwarden-web:latest

      - name: Build & push agent
        id: agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/ZWarden.Agent/Dockerfile
          push: true
          tags: |
            ${{ env.NS }}/zwarden-agent:${{ github.ref_name }}
            ${{ env.NS }}/zwarden-agent:latest

      - name: Build & push pzserver
        id: pzserver
        uses: docker/build-push-action@v6
        with:
          context: src/ZWarden.PZServer
          file: src/ZWarden.PZServer/Dockerfile
          push: true
          tags: |
            ${{ env.NS }}/zwarden-pzserver:${{ github.ref_name }}
            ${{ env.NS }}/zwarden-pzserver:latest

      # Sign each image by its immutable digest (never by a mutable tag), keylessly.
      - name: Sign the images (cosign keyless)
        run: |
          set -euo pipefail
          cosign sign --yes "${NS}/zwarden-web@${{ steps.web.outputs.digest }}"
          cosign sign --yes "${NS}/zwarden-agent@${{ steps.agent.outputs.digest }}"
          cosign sign --yes "${NS}/zwarden-pzserver@${{ steps.pzserver.outputs.digest }}"

      - name: SBOM — web
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.NS }}/zwarden-web@${{ steps.web.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-web.cdx.json
      - name: SBOM — agent
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.NS }}/zwarden-agent@${{ steps.agent.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-agent.cdx.json
      - name: SBOM — pzserver
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.NS }}/zwarden-pzserver@${{ steps.pzserver.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-pzserver.cdx.json

      - name: Attest each SBOM to its image (cosign keyless)
        run: |
          set -euo pipefail
          cosign attest --yes --type cyclonedx --predicate sbom-web.cdx.json "${NS}/zwarden-web@${{ steps.web.outputs.digest }}"
          cosign attest --yes --type cyclonedx --predicate sbom-agent.cdx.json "${NS}/zwarden-agent@${{ steps.agent.outputs.digest }}"
          cosign attest --yes --type cyclonedx --predicate sbom-pzserver.cdx.json "${NS}/zwarden-pzserver@${{ steps.pzserver.outputs.digest }}"

      # A self-contained, digest-pinned reference Compose: strip the build stanzas and pin web/agent to the
      # exact images published above. The PZServer image is pulled by the Agent at create time; its digest is
      # recorded in the release notes and the manifest below.
      - name: Write the digest-pinned reference Compose
        run: |
          set -euo pipefail
          WEB_REF="${NS}/zwarden-web@${{ steps.web.outputs.digest }}"
          AGENT_REF="${NS}/zwarden-agent@${{ steps.agent.outputs.digest }}"
          sed -e '/^    build:/,+2d' \
              -e "s#image: zwarden/web:latest#image: ${WEB_REF}#" \
              -e "s#image: zwarden/agent:latest#image: ${AGENT_REF}#" \
              deploy/compose/compose.yaml > compose.release.yaml
          {
            echo "# ZWarden ${{ github.ref_name }} — image digests (cosign-signed, SBOM-attested)"
            echo "web:      ${WEB_REF}"
            echo "agent:    ${AGENT_REF}"
            echo "pzserver: ${NS}/zwarden-pzserver@${{ steps.pzserver.outputs.digest }}"
          } > image-digests.txt

      - name: Checksums over the release assets
        run: sha256sum compose.release.yaml image-digests.txt sbom-*.cdx.json > SHA256SUMS

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            compose.release.yaml
            image-digests.txt
            sbom-web.cdx.json
            sbom-agent.cdx.json
            sbom-pzserver.cdx.json
            SHA256SUMS
          body: |
            Signed release. Every image is pushed to GHCR by digest, signed with cosign keyless, and carries a
            CycloneDX SBOM attestation. Verify before you run (replace OWNER):

            ```
            cosign verify \
              --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/release.yml@.*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              ghcr.io/OWNER/zwarden-web:${{ github.ref_name }}
            ```

            `image-digests.txt` lists the exact digests; `compose.release.yaml` is pinned to them; `SHA256SUMS`
            checksums the assets. See docs/deployment/compose-reference.md for the full verification steps.
